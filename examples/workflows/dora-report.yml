# Copy this file into your repo at .github/workflows/dora-report.yml
# Edit the `--since` date once on adoption (used only on cold cache).
#
# How it works:
#   - dora.db is persisted between runs via actions/cache. Subsequent
#     runs only fetch new PRs/deployments — so the weekly run is fast.
#   - On a cold cache (first run, or cache evicted after 7 days unused)
#     the pull re-fetches everything since `--since` — slower (a few
#     minutes for a year of history) but correct.
#   - dora-report.json is regenerated from the DB and committed back.
#
# Once deployed, share this link internally:
#   https://dimagi.github.io/dora/?url=https://raw.githubusercontent.com/<your-repo>/main/dora-report.json
name: DORA metrics
on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to commit dora-report.json back to the repo
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3

      # Persist dora.db between runs. The key includes run_id so each run
      # saves a fresh snapshot; restore-keys finds the most recent prior
      # cache. Bump the v1 prefix to bust the cache (e.g. on schema change).
      - name: Cache dora.db
        uses: actions/cache@v4
        with:
          path: dora.db
          key: dora-db-v1-${{ github.run_id }}
          restore-keys: dora-db-v1-

      - name: Install dora
        run: uv tool install git+https://github.com/dimagi/dora

      - name: Pull & report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dora pull --repo ${{ github.repository }} --since 2025-10-01
          dora report --format json --output dora-report.json

      - name: Commit report
        run: |
          git config user.name  "dora-bot"
          git config user.email "dora-bot@users.noreply.github.com"
          git add dora-report.json
          if git diff --staged --quiet; then
            echo "No change to dora-report.json"
          else
            git commit -m "Update DORA report"
            git push
          fi

# --- S3 variant (OIDC, recommended) -----------------------------------------
# If you'd rather host both the DB and the report in S3 (no DB in CI cache,
# no JSON in git history), use GitHub OIDC to get short-lived AWS credentials
# — no long-lived secrets to rotate.
#
# AWS one-time setup:
#   1. IAM → Identity providers → Add provider:
#        Type: OpenID Connect
#        URL:  https://token.actions.githubusercontent.com
#        Audience: sts.amazonaws.com
#   2. Create an IAM role (e.g. `dora-report-uploader`) with a trust policy
#      restricting it to your repo (and optionally branch):
#        {
#          "Version": "2012-10-17",
#          "Statement": [{
#            "Effect": "Allow",
#            "Principal": { "Federated": "arn:aws:iam::<ACCT>:oidc-provider/token.actions.githubusercontent.com" },
#            "Action":   "sts:AssumeRoleWithWebIdentity",
#            "Condition": {
#              "StringEquals": {
#                "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#              },
#              "StringLike": {
#                "token.actions.githubusercontent.com:sub": "repo:<OWNER>/<REPO>:ref:refs/heads/main"
#              }
#            }
#          }]
#        }
#   3. Attach a policy granting GetObject + PutObject on your bucket prefix.
#
# Workflow changes — replace "Cache dora.db" and "Commit report" with:
#
#     permissions:
#       id-token: write     # required for OIDC
#       contents: read
#
#       - name: Configure AWS via OIDC
#         uses: aws-actions/configure-aws-credentials@v4
#         with:
#           role-to-assume: arn:aws:iam::<ACCT>:role/dora-report-uploader
#           aws-region: us-east-1
#
#       - name: Download dora.db from S3
#         run: |
#           # First run: 404s and we start with an empty DB. That's fine.
#           aws s3 cp s3://my-bucket/dora.db ./dora.db || echo "no existing DB"
#
#       # ... pull & report steps run as before ...
#
#       - name: Upload to S3
#         run: |
#           uv tool install "git+https://github.com/dimagi/dora[s3]"
#           dora upload dora-report.json \
#             --target s3://my-bucket/dora-report.json --public-read
#           aws s3 cp dora.db s3://my-bucket/dora.db   # keep DB private
#
# S3 bucket CORS (so the dashboard can fetch dora-report.json):
#   [ { "AllowedOrigins": ["*"],
#       "AllowedMethods": ["GET"],
#       "AllowedHeaders": ["*"] } ]
#
# --- S3 variant (long-lived access keys, fallback) --------------------------
# If you can't add an OIDC provider on the AWS side, fall back to access keys
# stored as repo secrets. Same workflow shape, but replace the OIDC configure
# step with env vars on the AWS-using steps:
#
#       - name: Download dora.db from S3
#         env:
#           AWS_ACCESS_KEY_ID:     ${{ secrets.AWS_ACCESS_KEY_ID }}
#           AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
#           AWS_DEFAULT_REGION:    us-east-1
#         run: aws s3 cp s3://my-bucket/dora.db ./dora.db || echo "no existing DB"
#
# (The `permissions: id-token: write` line isn't needed in this variant.)
